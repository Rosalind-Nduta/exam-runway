<title>Exam Runway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column. Big countdown numerals, a horizontal "runway" of days from today to the last exam, then the day's sessions. */
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface2:#E3EBED; --ink:#10242B; --muted:#52666E; --line:#CAD6DA;
  --accent:#0F6B73; --on-accent:#FFFFFF; --signal:#D4531A; --on-signal:#FFFFFF; --ok:#2E7D4F; --warn:#B7791F;
  --s0:#0E7C86; --s1:#4457C9; --s2:#B8690C; --s3:#C23B63; --s4:#3A8A45; --s5:#8A4FC7;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C181D; --surface:#13252C; --surface2:#1B3139; --ink:#E5F0F2; --muted:#93A9B0; --line:#29434C;
    --accent:#4CC3CC; --on-accent:#06222A; --signal:#FF8A5C; --on-signal:#2A0E02; --ok:#73CC93; --warn:#E8B04D;
    --s0:#4CC3CC; --s1:#8C9CFF; --s2:#F0A446; --s3:#F27B9F; --s4:#76CC82; --s5:#BE93F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C181D; --surface:#13252C; --surface2:#1B3139; --ink:#E5F0F2; --muted:#93A9B0; --line:#29434C;
  --accent:#4CC3CC; --on-accent:#06222A; --signal:#FF8A5C; --on-signal:#2A0E02; --ok:#73CC93; --warn:#E8B04D;
  --s0:#4CC3CC; --s1:#8C9CFF; --s2:#F0A446; --s3:#F27B9F; --s4:#76CC82; --s5:#BE93F2; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 22px var(--display);letter-spacing:-.02em}
.brand svg{width:30px;height:30px;display:block}
.brand .lg-bg{fill:var(--accent)}.brand .lg-fg{stroke:var(--on-accent);fill:none;stroke-width:2.2;stroke-linecap:round}
.top-r{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;line-height:1.2;transition:transform .12s,background .12s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.signal{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{border-color:var(--signal);color:var(--signal)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:22px}
.hint{font-size:13px;color:var(--muted)}

/* hero note */
.hero{display:grid;gap:10px;padding:26px 24px;border-radius:14px;background:var(--accent);color:var(--on-accent)}
.hero .eyebrow{color:inherit;opacity:.75}
.hero h1{font-size:clamp(26px,4.4vw,40px);font-weight:800}
.hero p{font-size:clamp(16px,2vw,19px);max-width:62ch;opacity:.95}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.banner.info{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}

/* countdown */
.cd{--c:var(--s0);display:grid;gap:4px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cd-n{font:800 clamp(48px,7vw,68px)/.95 var(--display);color:var(--c);letter-spacing:-.04em}
.cd-n small{font:500 13px var(--mono);letter-spacing:.06em;color:var(--muted);margin-left:6px;text-transform:uppercase}
.cd h3{font-size:18px;margin-top:6px}
.cd .phase{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.cd.soon .cd-n{color:var(--signal)}

/* runway */
.runway{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.day{flex:0 0 58px;display:grid;gap:4px;justify-items:center;align-content:start;padding:8px 4px 8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:104px}
.day .wd{font:500 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.day .dn{font:700 20px var(--display)}
.day .marks{display:grid;gap:3px;width:100%;padding:0 6px;margin-top:2px}
.day .marks i{display:block;height:6px;border-radius:3px;border:1.5px solid var(--c);background:transparent}
.day .marks i.on{background:var(--c)}
.day.rest .dn{color:var(--muted)}
.day.rest .marks::before{content:"rest";font:500 10px var(--mono);color:var(--muted);text-align:center}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.sel{background:var(--surface2)}
.day.exam{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.day.exam .wd{color:inherit;opacity:.85}
.day.exam .ex{font:700 10px var(--mono);letter-spacing:.06em}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;border:1.5px solid var(--muted);display:inline-block}
.legend i.on{background:var(--muted)}
.legend i.ex{background:var(--signal);border-color:var(--signal);height:10px}

/* sessions */
.ses{--c:var(--s0);display:grid;grid-template-columns:72px 1fr auto;gap:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-items:start}
.ses .when{font:500 13px/1.5 var(--mono);color:var(--muted);padding-top:2px}
.ses .when b{display:block;color:var(--ink);font-weight:500}
.ses h4{font-size:18px;margin:6px 0 4px}
.ses .how{font-size:14px}
.ses .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.ses.done{opacity:.72}
.ses.done h4{text-decoration:line-through;text-decoration-thickness:1.5px}
.ses .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ses .rate{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:12px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line))}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip.plain::before{display:none}
.chip.plain{background:var(--surface2);border-color:var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* wizard */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.step{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.step.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.ok{color:var(--ink)}
.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding-block:12px 28px}
@media (max-width:820px){.welcome{grid-template-columns:1fr}}
.welcome h1{font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.03em}
.welcome h1 em{font-style:normal;color:var(--signal);white-space:nowrap}
.welcome .lead{font-size:18px;color:var(--muted);margin:16px 0 20px;max-width:46ch}
.feat{display:grid;gap:8px;margin:18px 0 0;padding:0;list-style:none;font-size:14.5px}
.feat li{display:flex;gap:10px}
.feat li::before{content:"";flex:0 0 8px;height:8px;border-radius:2px;background:var(--accent);margin-top:8px}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600}
label.f>span{color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sub{--c:var(--s0);display:grid;gap:14px}
.sub-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub-h .chip{font-size:12px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 4px 2px 12px;font-size:13.5px}
.tchip .lv{border:0;background:none;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:99px;margin-left:4px}
.tchip.weak{border-color:var(--signal)}.tchip.weak .lv{background:var(--signal);color:var(--on-signal)}
.tchip.strong{border-color:var(--ok)}.tchip.strong .lv{background:var(--ok);color:var(--bg)}
.tchip.ok .lv{background:var(--surface2);color:var(--muted)}
.tchip .fl{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 6px}
.tchip .fl[aria-pressed="true"]{color:var(--warn);font-weight:700}
.tchip .x{border:0;background:none;color:var(--muted);padding:4px 8px;font-size:15px;line-height:1}
.addrow{display:flex;gap:8px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.errs{border:1px solid var(--signal);background:color-mix(in srgb,var(--signal) 10%,var(--surface));border-radius:10px;padding:12px 16px;font-size:14px;margin-top:14px}
.errs ul{margin:6px 0 0;padding-left:18px}
.sum{display:grid;gap:8px;font-size:14.5px}
.sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.sum div:last-child{border:0}

/* plan */
.week{display:grid;gap:0;overflow:hidden;padding:0}
.week-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--surface2)}
.week-h h3{font-size:17px}
.prow{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 18px;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0}
.prow:hover{background:var(--surface2)}
.prow .d{font:500 13px var(--mono)}
.prow .d b{display:block;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.prow.examrow{background:color-mix(in srgb,var(--signal) 12%,var(--surface))}
textarea.out{font-family:var(--mono);font-size:12.5px;min-height:200px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tile b{display:block;font:800 34px/1 var(--display);letter-spacing:-.03em;margin-bottom:6px}
.tile span{font-size:13px;color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--c);display:block}
.dots i.on{background:var(--c)}
.lvl{font:600 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;margin-left:6px;color:var(--muted)}
.lvl.weak{color:var(--signal)}
.cp:first-child{border-top:0}
.cp{display:grid;grid-template-columns:100px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:14px}
.pill{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok);color:var(--bg)}
.pill.late{background:var(--signal);color:var(--on-signal)}
.load{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:8px;overflow-x:auto}
.load>div{flex:1 0 26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.load .col{width:100%;background:var(--line);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.load .col i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:4px 4px 0 0}
.load small{font:500 10px var(--mono);color:var(--muted)}

/* reflect */
details.rw{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.rw>summary{cursor:pointer;padding:16px 20px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
details.rw>summary::-webkit-details-marker{display:none}
.rw-b{display:grid;gap:14px;padding:0 20px 20px}

/* dock + toast */
.dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;display:grid;gap:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dock .clock{font-size:44px;font-weight:500;line-height:1}
.dock .tbar{height:5px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.dock .tbar i{display:block;height:100%;background:var(--signal);width:0}
.dock .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.dock .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.dock .sm{font-size:12px;opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.foot{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}

@media (max-width:640px){
  .ses{grid-template-columns:1fr;gap:10px}
  .ses .when{display:flex;gap:8px}.ses .when b{display:inline}
  .ses .act{justify-content:flex-start}
  .prow{grid-template-columns:1fr;gap:6px}
  .trow,.cp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" class="wrap"></div>
<div id="dock"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/DAY);
const todayStr=()=>ymd(new Date());
const monday=s=>addDays(s,-((parse(s).getDay()+6)%7));
const fmt=(s,o)=>parse(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'}).replace(',','');
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;};
const SUBC=6;

/* ---------- state ---------- */
const KEY='exam-runway-v1';
let mem=null;
function fresh(){return{v:1,profile:{name:'',course:''},subjects:[],
  avail:{weekday:2,weekend:3,time:'evening',sessionMin:50,focusMin:25,breakMin:5,daysOff:[],style:'solo',methods:['practice','flashcards','summaries']},
  sessions:[],reflections:{},setupDone:false,theme:null,createdAt:null,shortfall:0,planned:null};}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return mem;}
let S=load()||fresh();
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const ui={tab:'today',sel:todayStr(),step:1,wizard:!S.setupDone,editing:false,rate:null,errs:[],copy:null,resetArm:false,importMsg:''};
const root=$('#app');

/* ---------- domain helpers ---------- */
const sub=id=>S.subjects.find(s=>s.id===id);
const subjectTopics=s=>s.topics.length?s.topics:[{id:'__all_'+s.id,name:'Whole syllabus',level:'ok',flag:false,extra:0,synthetic:true}];
function topicOf(x){const s=sub(x.subjectId);if(!s||!x.topicId)return null;return subjectTopics(s).find(t=>t.id===x.topicId)||null;}
const topicName=x=>x.kind==='mock'?'Full mock paper':(topicOf(x)?topicOf(x).name:'Topic');
const activeExams=()=>{const t=todayStr();return S.subjects.filter(s=>s.date&&s.date>=t).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);};
const lastExam=()=>activeExams().reduce((m,s)=>s.date>m?s.date:m,'');
const sessOn=d=>S.sessions.filter(x=>x.date===d).sort((a,b)=>a.start-b.start);
const KIND={learn:'Learn',practice:'Practise',revise:'Revise',recall:'Recall',review:'Final recap',mock:'Mock exam'};
const KINDS=['learn','practice','revise','recall','practice','revise'];
const METHODS={flashcards:'Flashcards',practice:'Practice questions',summaries:'Summaries',mindmaps:'Mind maps'};
const LVL={weak:'Weak',ok:'Okay',strong:'Strong'};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function targetPasses(s,t){
  let n={weak:3,ok:2,strong:1}[t.level||'ok'];
  if(t.flag)n+=1;
  if(s.grade!==''&&s.grade!=null&&+s.grade<55&&t.level!=='strong')n+=1;
  if(s.confidence<=2&&t.level!=='strong')n+=1;
  n+=(t.extra||0);
  if(t.synthetic)n=n*2+1;
  return Math.min(n,t.synthetic?8:6);
}
function dayCap(d){const A=S.avail,dow=parse(d).getDay();if(A.daysOff.indexOf(dow)>-1)return 0;return Math.round(((dow===0||dow===6)?A.weekend:A.weekday)*60);}
function blockLens(cap,sm){const out=[];let rem=cap;while(rem>=25){const len=Math.min(sm,rem);if(len<25)break;out.push(Math.floor(len/5)*5);rem-=len+10;}return out;}
const prefStart=()=>({morning:480,afternoon:840,evening:1110}[S.avail.time]||1110);
function nowStart(){const n=new Date();return Math.max(prefStart(),Math.ceil((n.getHours()*60+n.getMinutes()+10)/15)*15);}

function pickMethod(kind,idx){
  const pref={learn:['summaries','mindmaps','flashcards'],practice:['practice','flashcards'],revise:['flashcards','mindmaps','summaries'],
    recall:['flashcards','practice'],review:['flashcards','summaries'],mock:['practice']}[kind];
  const mine=pref.filter(m=>S.avail.methods.indexOf(m)>-1);
  if(mine.length)return mine[idx%mine.length];
  return pref[0];
}
function tip(x){
  const T=topicName(x),m=x.method;let t='';
  if(x.kind==='mock')t='Sit a timed paper under exam conditions, no notes. Mark it straight after and list every mark you lost.';
  else if(m==='summaries')t=x.kind==='learn'?'Read your notes on '+T+', then write a one-page summary from memory in your own words. The gaps show what to re-read.':'Rewrite your '+T+' summary at half the length. Keep only what you could not recall.';
  else if(m==='mindmaps')t='Draw a mind map of '+T+' with the main idea in the centre and one example on every branch.';
  else if(m==='flashcards')t=x.kind==='learn'?'Make 10 to 15 cards on '+T+' with a question on the front and the answer on the back.':'Test yourself on '+T+' cards. Move every miss to an "again" pile and repeat until it is empty.';
  else t='Do 5 to 10 questions on '+T+' without notes first. Check answers, then redo the ones you missed.';
  if(S.avail.style==='group')t+=' Swap questions with a study partner and explain answers out loud.';
  return t;
}
function rounds(min){const A=S.avail;return Math.max(1,Math.round(min/(A.focusMin+A.breakMin)));}

/* ---------- planner ---------- */
function replan(){
  const A=S.avail,today=todayStr();
  const kept=S.sessions.filter(x=>x.done&&sub(x.subjectId));
  const missed=S.sessions.filter(x=>!x.done&&x.date<today).length;
  const subs=S.subjects.filter(s=>s.date&&s.date>=today);
  const sessions=kept.slice();
  S.shortfall=0;
  if(!subs.length){S.sessions=sessions;S.planned=today;save();return{missed,shortfall:0};}
  const last=lastExam();
  const days=[];for(let d=today;d<last;d=addDays(d,1))days.push(d);
  const doneMin={},lastEnd={};
  kept.forEach(x=>{doneMin[x.date]=(doneMin[x.date]||0)+x.min+10;lastEnd[x.date]=Math.max(lastEnd[x.date]||0,x.end||0);});
  const capOf=d=>{
    let c=dayCap(d);
    if(subs.some(s=>s.date===d))c=Math.round(c*0.5);
    c=Math.max(0,c-(doneMin[d]||0));
    if(d===today){const avail=1410-Math.max(nowStart(),(lastEnd[d]||0)+10);c=Math.min(c,Math.max(0,avail));if(c<45)c=0;}
    return c;
  };
  const lensOf={};days.forEach(d=>{lensOf[d]=blockLens(capOf(d),A.sessionMin);});
  const lastDone={},doneCount={},mockDone={};
  kept.forEach(x=>{
    if(x.topicId&&(!lastDone[x.topicId]||x.date>lastDone[x.topicId]))lastDone[x.topicId]=x.date;
    if(x.kind==='mock')mockDone[x.subjectId]=(mockDone[x.subjectId]||0)+1;
    else if(x.topicId)doneCount[x.topicId]=(doneCount[x.topicId]||0)+1;
  });
  const W=subs.map(s=>{
    const topics=subjectTopics(s).map(t=>({t:t,tgt:targetPasses(s,t),done:doneCount[t.id]||0,sched:0}));
    topics.forEach(x=>{x.rem=Math.max(0,x.tgt-x.done);});
    const dte=diffDays(today,s.date);
    const mocks=dte>=21?2:dte>=6?1:0;
    return{s:s,topics:topics,mockRem:Math.max(0,mocks-(mockDone[s.id]||0))};
  });
  const totalCap=days.reduce((a,d)=>a+lensOf[d].length,0);
  const topicRem=w=>w.topics.reduce((b,x)=>b+x.rem,0);
  const need=()=>W.reduce((a,w)=>a+w.mockRem+topicRem(w),0);
  let guard=0;
  while(need()<0.72*totalCap&&guard++<600){
    let best=null,bs=-1e9;
    W.forEach(w=>w.topics.forEach(x=>{
      const max=x.t.synthetic?8:6;if(x.done+x.rem>=max)return;
      const sc=({weak:3,ok:2,strong:1}[x.t.level||'ok'])*10+(x.t.flag?5:0)-(x.done+x.rem)*4;
      if(sc>bs){bs=sc;best=x;}
    }));
    if(!best)break;best.rem++;
  }
  let capLeft=totalCap;
  const blocksUntil=(i,ex)=>{let n=0;for(let k=i;k<days.length&&days[k]<ex;k++)n+=lensOf[days[k]].length;return n;};
  const out=[];
  days.forEach((d,i)=>{
    const lens=lensOf[d];if(!lens.length)return;
    const elig=W.filter(w=>d<w.s.date);
    const work=w=>{const dte=diffDays(d,w.s.date);return topicRem(w)+((dte>=2&&dte<=4)?w.mockRem:0);};
    const live=elig.filter(w=>work(w)>0);
    if(!live.length){capLeft-=lens.length;return;}
    const press=w=>{const r=work(w);if(!r)return 0;const bl=Math.max(1,blocksUntil(i,w.s.date));return r/(bl/Math.max(1,live.length));};
    let n=Math.min(lens.length,Math.max(1,Math.ceil(need()*lens.length/Math.max(1,capLeft))));
    if(live.some(w=>press(w)>=0.85))n=lens.length;
    let prev=null;
    for(let b=0;b<n;b++){
      const cands=elig.map(w=>({w:w,p:press(w)})).filter(c=>c.p>0).sort((a,c)=>c.p-a.p);
      if(!cands.length)break;
      let pick=cands[0];
      if(prev&&pick.w.s.id===prev&&cands.length>1&&cands[1].p>=0.6*pick.p)pick=cands[1];
      const w=pick.w;prev=w.s.id;
      const dte=diffDays(d,w.s.date);
      let x;
      if(w.mockRem>0&&dte>=2&&dte<=4){
        w.mockRem--;
        x={id:uid(),date:d,subjectId:w.s.id,topicId:null,kind:'mock',passNo:0,min:lens[b],done:false,ord:b};
      }else{
        const tc=w.topics.filter(t=>t.rem>0).map(t=>({t:t,sc:((t.done+t.sched)===0?3:0)+t.rem+(t.t.level==='weak'?0.8:0)+(t.t.flag?0.5:0)+(lastDone[t.t.id]?Math.min(diffDays(lastDone[t.t.id],d),4)*0.5:2)})).sort((a,c)=>c.sc-a.sc);
        if(!tc.length)continue;
        const t=tc[0].t;const passNo=t.done+t.sched;
        const kind=dte<=1?'review':KINDS[passNo%KINDS.length];
        t.rem--;t.sched++;lastDone[t.t.id]=d;
        x={id:uid(),date:d,subjectId:w.s.id,topicId:t.t.id,kind:kind,passNo:passNo,min:lens[b],done:false,ord:b};
      }
      x.method=pickMethod(x.kind,hash(x.date)+x.ord);
      out.push(x);
    }
    capLeft-=lens.length;
  });
  S.shortfall=W.reduce((a,w)=>a+topicRem(w),0);
  /* clock times */
  const byDay={};out.forEach(x=>{(byDay[x.date]=byDay[x.date]||[]).push(x);});
  Object.keys(byDay).forEach(d=>{
    const list=byDay[d].sort((a,b)=>a.ord-b.ord);
    const total=list.reduce((a,x)=>a+x.min,0)+10*(list.length-1);
    let st=prefStart();
    if(d===today)st=Math.max(nowStart(),(lastEnd[d]||0)+10);
    if(st+total>1410)st=Math.max(360,1410-total);
    list.forEach(x=>{x.start=st;x.end=st+x.min;st+=x.min+10;});
  });
  S.sessions=sessions.concat(out).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.start-b.start);
  S.planned=today;save();
  return{missed:missed,shortfall:S.shortfall};
}

/* ---------- motivation ---------- */
function phase(days){
  if(days<=0)return 'Exam day. Trust the work you did.';
  if(days===1)return 'Light recap, then an early night';
  if(days===2)return 'Final review of weak spots';
  if(days<=6)return 'Mock papers and weak spots';
  if(days<=13)return 'Mix in past questions';
  if(days<=21)return 'Deepen and practise';
  return 'Build solid foundations';
}
function note(d){
  const nm=S.profile.name||'friend',ex=activeExams(),ss=sessOn(d);
  if(ex.find(e=>e.date===d))return 'Exam day, '+nm+'. You did the work. Read every question twice and start with the ones you know.';
  const tm=ex.find(e=>e.date===addDays(d,1));
  if(tm)return tm.name+' is tomorrow. Keep today light, pack your bag, and sleep. Sleep is revision too.';
  if(!ss.length)return 'Rest is part of the plan, '+nm+'. Your brain files things away while you recharge.';
  const f=ss[0],s=sub(f.subjectId),left=diffDays(d,s.date);
  const weak=ss.find(x=>{const t=topicOf(x);return t&&t.level==='weak';});
  const pool=[
    'Pressure makes diamonds, '+nm+'. Today’s focus sharpens your edge for the '+s.name+' exam.',
    left+' days to '+s.name+'. Small steady sessions beat last-night panic every time.',
    'You do not have to feel ready to start. Open '+topicName(f)+' for '+f.min+' minutes and let momentum do the rest.',
    'Every session you tick off is a vote for the person who walks into that exam calm.',
    'Done is better than perfect, '+nm+'. One focused block today moves '+s.name+' forward.',
    'Consistency is the whole trick. Show up for today’s plan and the exam takes care of itself.'
  ];
  if(weak)pool.push(topicName(weak)+' is a weak spot, so it gets extra time today. Weak spots are where the easy marks hide.',topicName(weak)+' feels hard right now. That is exactly why it is on the plan. Hard today means easy on exam day.');
  return pool[hash(d+nm)%pool.length];
}

function checkpoints(){

    defs.forEach(df=>{
      const l=ss.filter(df[1]);if(!l.length)return;
      const date=l.reduce((m,x)=>x.date>m?x.date:m,'');const dn=l.every(x=>x.done);

    });
  });

}

function validate(){

  if(S.subjects.length&&!S.subjects.some(s=>s.date&&s.date>=t))e.push('At least one exam date must be today or later.');

function addTopics(sid,txt){
  const s=sub(sid);if(!s)return;
  txt.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!s.topics.some(t=>t.name.toLowerCase()===n.toLowerCase()))s.topics.push({id:uid(),name:n,level:'ok',flag:false,extra:0});});

}

  if(a==='flagt'){const t=sub(d.sid).topics.find(z=>z.id===d.tid);t.flag=!t.flag;save();render();return;}
  if(a==='rmt'){const s=sub(d.sid);s.topics=s.topics.filter(z=>z.id!==d.tid);save();render();return;}
  if(a==='addt'){const el=document.getElementById('ti-'+d.sid);if(el&&el.value.trim()){addTopics(d.sid,el.value);el.value='';render();const n=document.getElementById('ti-'+d.sid);if(n)n.focus();}return;}
  if(a==='av'){A[d.k]=d.k==='sessionMin'?+d.v:d.v;save();render();return;}
  if(a==='off'){const n=+d.d,i=A.daysOff.indexOf(n);if(i>-1)A.daysOff.splice(i,1);else A.daysOff.push(n);save();render();return;}
  if(a==='method'){const i=A.methods.indexOf(d.v);if(i>-1){if(A.methods.length>1)A.methods.splice(i,1);}else A.methods.push(d.v);save();render();return;}

    if(d.v==='shaky'){const t=topicOf(x);if(t&&!t.synthetic){t.level='weak';t.extra=(t.extra||0)+1;}else if(t){}
      const s=sub(x.subjectId);if(!t||t.synthetic){s.confidence=Math.max(1,s.confidence-1);}
      replan();toast(topicName(x)+' gets extra revision time. Plan reshuffled.');}
    else{save();toast(d.v==='solid'?'Locked in.':'Good. Keep moving.');}
    render();return;
  }
  if(a==='replan'){const r=replan();render();toast(r.missed?r.missed+' missed session'+(r.missed>1?'s':'')+' rolled into your plan.':'Plan reshuffled around today.');return;}
  if(a==='addtime'){A.weekday=Math.min(14,A.weekday+0.5);A.weekend=Math.min(14,A.weekend+0.5);replan();render();toast('Added 30 minutes a day and reshuffled.');return;}
  if(a==='saveref'){
    const r=S.reflections[d.w]=S.reflections[d.w]||{};r.saved=true;
    let n=0;(r.needs||[]).forEach(tid=>{if((r.applied||[]).indexOf(tid)>-1)return;S.subjects.forEach(s=>s.topics.forEach(t=>{if(t.id===tid){t.level='weak';t.extra=(t.extra||0)+1;n++;}}));r.applied=(r.applied||[]).concat(tid);});
    if(n)replan();else save();render();toast(n?'Saved. '+n+' topic'+(n>1?'s':'')+' got extra time.':'Check-in saved.');return;
  }
  if(a==='flagweak'){const r=S.reflections[d.w]=S.reflections[d.w]||{};r.needs=r.needs||[];const i=r.needs.indexOf(d.tid);if(i>-1)r.needs.splice(i,1);else r.needs.push(d.tid);save();render();return;}
  if(a==='energy'){const w=d.k.split('|')[1];(S.reflections[w]=S.reflections[w]||{}).energy=+d.v;save();render();return;}
  if(a==='copyplan'){const txt=planText();copy(txt,'plan');return;}
  if(a==='copybackup'){copy(JSON.stringify(S),'backup');return;}
  if(a==='import'){
    const v=($('#importbox')||{}).value||'';
    try{const o=JSON.parse(v);if(!o||!Array.isArray(o.subjects)||!o.avail)throw 0;S=Object.assign(fresh(),o);save();ui.wizard=!S.setupDone;ui.importMsg='';render();toast('Backup restored.');}
    catch(err){ui.importMsg='That text is not a valid backup.';render();}
    return;
  }
  if(a==='reset'){ui.resetArm=true;render();return;}
  if(a==='resetno'){ui.resetArm=false;render();return;}
  if(a==='resetgo'){S=fresh();save();ui.resetArm=false;ui.wizard=true;ui.step=1;ui.tab='today';ui.editing=false;document.documentElement.removeAttribute('data-theme');render();window.scrollTo(0,0);return;}
  if(a==='focus'){dockOpen(d.id);return;}
  if(a==='tgo'){dockT.running=!dockT.running;dockDraw();return;}
  if(a==='tskip'){dockNext();return;}
  if(a==='tclose'){dockClose();return;}
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.prof){S.profile[d.prof]=t.value;save();return;}
  if(d.f&&d.sid){const s=sub(d.sid);if(!s)return;if(d.f==='grade')s.grade=t.value===''?'':Math.max(0,Math.min(100,+t.value));else s[d.f]=t.value;save();return;}
  if(d.av){const n=+t.value;S.avail[d.av]=isNaN(n)?0:n;save();return;}
  if(d.ref){const r=S.reflections[d.w]=S.reflections[d.w]||{};r[d.ref]=t.value;save();return;}
  if(d.ti&&/[,;]$/.test(t.value)){addTopics(d.ti,t.value);t.value='';render();const n=document.getElementById('ti-'+d.ti);if(n)n.focus();}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ti&&e.key==='Enter'){e.preventDefault();if(t.value.trim()){addTopics(t.dataset.ti,t.value);t.value='';render();const n=document.getElementById('ti-'+t.dataset.ti);if(n)n.focus();}}
});
document.addEventListener('focusout',e=>{
  const t=e.target;if(t.dataset&&t.dataset.ti&&t.value.trim()&&!(e.relatedTarget&&e.relatedTarget.dataset&&e.relatedTarget.dataset.act==='addt')){addTopics(t.dataset.ti,t.value);t.value='';render();}
});

function planText(){
  const L=['EXAM RUNWAY plan for '+(S.profile.name||'student'),''];
  activeExams().forEach(s=>L.push(s.name+': '+fmt(s.date,{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' ('+diffDays(todayStr(),s.date)+' days)'));
  L.push('');
  let cur='';
  S.sessions.filter(x=>x.date>=todayStr()).forEach(x=>{
    if(x.date!==cur){cur=x.date;L.push(fmt(cur,{weekday:'long',day:'numeric',month:'short'}));}
    L.push('  '+hm(x.start)+'-'+hm(x.end)+'  '+sub(x.subjectId).name+' | '+topicName(x)+' ('+KIND[x.kind]+', '+METHODS[x.method]+')'+(x.done?' [done]':''));
  });
  return L.join('\n');
}
function copy(text,kind){
  ui.copy={kind:kind,text:text};
  const fin=ok=>{render();if(ok)toast('Copied to clipboard.');else{const b=document.getElementById('copybox');if(b){b.focus();b.select();}toast('Select the text and copy it.');}};
  try{navigator.clipboard.writeText(text).then(()=>fin(true),()=>fin(false));}catch(e){fin(false);}
}

/* ---------- focus timer dock ---------- */
const dockT={sid:null,phase:'focus',left:0,total:0,running:false,round:1,rounds:1,done:false,h:null};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=0.08;o.start();o.stop(c.currentTime+0.3);}catch(e){}}
function dockOpen(id){
  const x=S.sessions.find(z=>z.id===id);if(!x)return;
  clearInterval(dockT.h);
  Object.assign(dockT,{sid:id,phase:'focus',left:S.avail.focusMin*60,total:S.avail.focusMin*60,running:true,round:1,rounds:rounds(x.min),done:false});
  dockT.h=setInterval(tick,1000);dockDraw();
}
function dockClose(){clearInterval(dockT.h);dockT.sid=null;dockT.running=false;dockDraw();}
function dockNext(){
  if(dockT.done)return;
  if(dockT.phase==='focus'){
    if(dockT.round>=dockT.rounds){dockT.done=true;dockT.running=false;beep();}
    else{dockT.phase='break';dockT.left=dockT.total=S.avail.breakMin*60;beep();}
  }else{dockT.phase='focus';dockT.round++;dockT.left=dockT.total=S.avail.focusMin*60;beep();}
  dockDraw();
}
function tick(){
  if(!dockT.running)return;
  dockT.left--;
  if(dockT.left<=0){dockNext();return;}
  const c=$('#tclock'),b=$('#tbar');
  if(c)c.textContent=pad(Math.floor(dockT.left/60))+':'+pad(dockT.left%60);
  if(b)b.style.width=Math.round((1-dockT.left/dockT.total)*100)+'%';
}
function dockDraw(){
  const el=$('#dock');
  if(!dockT.sid){el.innerHTML='';return;}
  const x=S.sessions.find(z=>z.id===dockT.sid);if(!x){el.innerHTML='';return;}
  const s=sub(x.subjectId);
  if(dockT.done){
    el.innerHTML='<div class="dock"><div class="sm">'+esc(s.name)+' · '+esc(topicName(x))+'</div><b style="font:700 20px var(--display)">Session complete</b><div class="sm">Great focus. Log it to keep your progress honest.</div><div style="display:flex;gap:8px"><button class="btn primary sm" data-act="done" data-id="'+x.id+'">Mark done</button><button class="btn sm" data-act="tclose">Close</button></div></div>';
    return;
  }
  el.innerHTML='<div class="dock"><div class="sm">'+esc(s.name)+' · '+esc(topicName(x))+'</div><div class="clock mono" id="tclock">'+pad(Math.floor(dockT.left/60))+':'+pad(dockT.left%60)+'</div>'+
    '<div class="tbar"><i id="tbar" style="width:'+Math.round((1-dockT.left/dockT.total)*100)+'%"></i></div><div class="sm">'+(dockT.phase==='focus'?'Focus round '+dockT.round+' of '+dockT.rounds:'Break. Stand up, drink water.')+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-act="tgo">'+(dockT.running?'Pause':'Resume')+'</button><button class="btn sm" data-act="tskip">Skip</button><button class="btn sm" data-act="tclose">Close</button></div></div>';
}

/* ---------- boot ---------- */
if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);
if(S.setupDone){
  const t=todayStr();
  if(S.sessions.some(x=>!x.done&&x.date<t)||S.planned!==t){
    const r=replan();
    if(r.missed)setTimeout(()=>toast(r.missed+' missed session'+(r.missed>1?'s':'')+' rolled into today’s plan.'),400);
  }
}
render();
})();
</script>
